# Copy used when android/ is pushed as its own repository. If android/ lives inside the vibespace repo,
# GitHub only reads the workflow at the repo root: ../../.github/workflows/android.yml (already set up).
# Builds the VibeSpace Android debug APK (and runs unit tests) on every push / PR that touches android/,
# or on demand from the Actions tab ("Run workflow"). Free on GitHub for public and private repos (within minutes quota).
#
# Point the APK at your server: Settings → Secrets and variables → Actions → Variables →
#   New repository variable  VIBESPACE_API_BASE_URL = https://api.yourdomain.in
# (or type a URL in the "Run workflow" box). Default: http://10.0.2.2:3000 (Android emulator → your PC).
name: Android APK

on:
  push:
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL baked into the APK (blank = repository variable or emulator default)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .
    env:
      VIBESPACE_API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.VIBESPACE_API_BASE_URL || 'http://10.0.2.2:3000' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 37 and build tools
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug -PVIBESPACE_API_BASE_URL="$VIBESPACE_API_BASE_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VibeSpace-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
