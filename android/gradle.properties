# Sized for small machines (2 CPUs / 7 GB RAM). CI runners have more, which is fine.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx1536m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# API server the app talks to. Override per build without editing files:
#   ./gradlew assembleDebug -PVIBESPACE_API_BASE_URL=https://api.example.com
# 10.0.2.2 is the Android emulator's alias for the host machine's localhost.
VIBESPACE_API_BASE_URL=https://vibespace-api-vwb7.onrender.com
