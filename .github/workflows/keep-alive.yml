name: Keep alive
on:
  schedule:
    - cron: '30 3 * * *'   # daily 9:00 AM IST
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API (touches the database)
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 90 https://vibespace-api-vwb7.onrender.com/health; then echo; echo "OK"; exit 0; fi
            echo "Attempt $i failed, retrying in 30s"; sleep 30
          done
          exit 1
